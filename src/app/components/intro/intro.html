<section id="home" class="intro">
  <div class="container intro__inner">
    <div class="intro__photo-wrap">
      <img
        class="intro__photo"
        src="assets/images/profile/me.jpg"
        alt="Jérémy Vandeputte"
        width="400"
        height="400"
        loading="eager"
        fetchpriority="high"
      />
    </div>

    <div class="intro__content">
      <p class="eyebrow">{{ 'intro.greeting' | translate }}</p>
      <h1 class="intro__name">Jérémy Vandeputte</h1>
      <p class="intro__role">{{ 'intro.role' | translate }}</p>
      <p class="intro__tagline">{{ 'intro.tagline' | translate }}</p>

      <div class="intro__cta">
        <a class="btn btn-primary" [routerLink]="['/']" fragment="projects">{{
          'intro.ctaProjects' | translate
        }}</a>
        <a class="btn btn-secondary" [routerLink]="['/']" fragment="contact">{{
          'intro.ctaContact' | translate
        }}</a>
      </div>

      <div class="intro__socials">
        <a [href]="social.githubPersonal" target="_blank" rel="noopener" aria-label="GitHub personnel">
